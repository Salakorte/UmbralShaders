# Preserve vanilla directional shading and baked ambient occlusion.
oldLighting=true
separateAo=false
vignette=false
sun=true
moon=true
sky=true
stars=true
underwaterOverlay=true
shadowEntities=true
shadowPlayer=true
shadowBlockEntities=true
particles.ordering=mixed

screen=SHADOW_STYLE SHADOWS_ENABLED <profile> SHADOW_INTENSITY SHADOW_SOFTNESS shadowDistance shadowMapResolution [ILLUMINATION]
screen.columns=2
#ifdef DISTANT_HORIZONS
screen=SHADOW_STYLE SHADOWS_ENABLED <profile> SHADOW_INTENSITY SHADOW_SOFTNESS shadowDistance shadowMapResolution DH_CAST_SHADOWS [ILLUMINATION]
#endif
screen.ILLUMINATION=RAY_TRACED_GI RT_BLOCK_LIGHTS GI_QUALITY GI_INTENSITY RT_GLASS_TRANSMISSION RT_WATER_REFLECTIONS RT_GLASS_REFLECTIONS RT_REFLECTION_STRENGTH
sliders=SHADOW_INTENSITY shadowDistance GI_INTENSITY RT_REFLECTION_STRENGTH
#if defined(RT_BLOCK_LIGHTS) || defined(RT_GLASS_TRANSMISSION) || defined(RAY_TRACED_GI)
iris.features.required=CUSTOM_IMAGES COMPUTE_SHADERS BLOCK_EMISSION_ATTRIBUTE
shadow.culling=reversed
shadow.enabled=true
image.vsVoxels=vsVoxelRead RED_INTEGER R32UI UNSIGNED_INT true false 64 64 64
#ifdef RT_BLOCK_LIGHTS
image.vsEmitters=vsEmitterRead RED_INTEGER R32UI UNSIGNED_INT false false 49 64
#endif
#ifdef RT_GLASS_TRANSMISSION
image.vsWindows=vsWindowRead RED_INTEGER R32UI UNSIGNED_INT false false 25 64
#endif
#endif
#ifdef RT_GLASS_TRANSMISSION
shadowTranslucent=true
#else
shadowTranslucent=false
#endif
profile.Low=SHADOWS_ENABLED SHADOW_INTENSITY:0.35 SHADOW_SOFTNESS:0 shadowDistance:32.0 shadowMapResolution:1024
profile.Medium=SHADOWS_ENABLED SHADOW_INTENSITY:0.35 SHADOW_SOFTNESS:1 shadowDistance:96.0 shadowMapResolution:2048
profile.High=SHADOWS_ENABLED SHADOW_INTENSITY:0.35 SHADOW_SOFTNESS:2 shadowDistance:256.0 shadowMapResolution:4096
profile.Photoreal=SHADOWS_ENABLED SHADOW_STYLE:1 SHADOW_INTENSITY:0.35 SHADOW_SOFTNESS:2 shadowDistance:96.0 shadowMapResolution:2048 RAY_TRACED_GI RT_BLOCK_LIGHTS RT_GLASS_TRANSMISSION GI_QUALITY:1 GI_INTENSITY:1.50
program.shadow.enabled=SHADOWS_ENABLED || RT_BLOCK_LIGHTS || RT_GLASS_TRANSMISSION || RAY_TRACED_GI
program.dh_shadow.enabled=SHADOWS_ENABLED && DH_CAST_SHADOWS
program.no_sun/shadow.enabled=false
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex6=off
blend.gbuffers_terrain.colortex7=off
program.deferred.enabled=RAY_TRACED_GI || RT_BLOCK_LIGHTS || RT_GLASS_TRANSMISSION
program.no_sun/deferred.enabled=RAY_TRACED_GI
program.deferred1.enabled=RAY_TRACED_GI || RT_BLOCK_LIGHTS || RT_GLASS_TRANSMISSION
program.no_sun/deferred1.enabled=RAY_TRACED_GI
program.deferred2.enabled=RT_WATER_REFLECTIONS || RT_GLASS_REFLECTIONS
program.no_sun/deferred2.enabled=RT_WATER_REFLECTIONS || RT_GLASS_REFLECTIONS
program.shadowcomp.enabled=RT_BLOCK_LIGHTS || RT_GLASS_TRANSMISSION || RAY_TRACED_GI
program.shadowcomp1.enabled=RT_BLOCK_LIGHTS || RT_GLASS_TRANSMISSION
